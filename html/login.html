<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hostel Management System</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>HostelHub Login</h1>
                <p>Access your hostel management portal</p>
            </div>

            <div class="role-selector">
                <div class="role-option active" data-role="student">Student</div>
                <div class="role-option" data-role="warden">Warden</div>
                <div class="role-option" data-role="admin">Admin</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username/Email</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                </div>

                <input type="hidden" id="role" name="role" value="student">

                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div id="loginError" role="alert" style="display: none; margin-top: 1rem; color: #d9534f;"></div>

            <div class="auth-footer">
                <p><a href="#">Forgot password?</a></p>
                <p>Don't have an account? <a href="student-registration.html">Register here</a></p>
            </div>
        </div>
    </div>

    <script src="../js/init-data.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
